%YAML 1.2
---
$id: http://devicetree.org/schemas/pwm/hichip,hc16xx-pwm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiChip HC16XX PWM controller

maintainers:
  - Siarhei Volkau <lis8215@gmail.com>

description: |
  The HiChip HC16XX PWM controller provides six "independent"
  PWM channels.

  "Independent" because PWM0 must be enabled when any other
  channel is enabled. Therefore, PWM0 is handled specially
  by the driver. Also they all use single clock source divider
  and in company with low bits counters it became a headache
  to select a divider, thus untouched in the driver.

properties:
  compatible:
    const: hichip,hc16xx-pwm

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  '#pwm-cells':
    const: 3

required:
  - compatible
  - reg
  - clocks
  - '#pwm-cells'

additionalProperties: false

examples:
  - |
    pwm: pwm@18818410 {
        compatible = "hichip,hc16xx-pwm";
        reg = <0x18818410 0x24>;
        clocks = <&clk HC16XX_CLK_SB_27M>;
        #pwm-cells = <3>;
    };
