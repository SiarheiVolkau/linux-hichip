%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/hichip,hc16xx-usb-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiChip HC16XX USB 2.0 PHY

maintainers:
  - Siarhei Volkau <lis8215@gmail.com>

description:
  The HiChip HC16XX USB PHY provides the analog USB 2.0 physical
  interface for the HC16XX MUSB USB controller.

  The PHY contains registers for USB high-speed signal tuning and
  disconnect threshold configuration. The Linux driver currently
  configures the USB disconnect threshold voltage during PHY
  initialization.

properties:
  compatible:
    const: hichip,hc16xx-usb-phy

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    usb0phy: phy@18845000 {
        compatible = "hichip,hc16xx-usb-phy";
        reg = <0x18845000 0x24>;
        #phy-cells = <0>;
    };

  - |
    usb1phy: phy@18845100 {
        compatible = "hichip,hc16xx-usb-phy";
        reg = <0x18845100 0x24>;
        #phy-cells = <0>;
    };
