%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/hichip,hc16xx-musb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiChip HC16XX MUSB USB controller

maintainers:
  - Siarhei Volkau <lis8215@gmail.com>

description:
  The HiChip HC16XX USB controller is based on the Mentor MUSB
  dual-role USB controller. OTG mode is not supported yet.

properties:
  compatible:
    const: hichip,hc16xx-musb

  reg:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 2

  interrupt-names:
    minItems: 1
    items:
      - const: mc
      - const: dma

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  phys:
    maxItems: 1

  dr_mode:
    enum:
      - host
      - peripheral

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - resets
  - phys

additionalProperties: false

examples:
  - |
    usb0: usb@18844000 {
        compatible = "hichip,hc16xx-musb";
        reg = <0x18844000 0x1000>;

        interrupt-parent = <&intc>;
        interrupts = <53>, <52>;
        interrupt-names = "mc", "dma";

        clocks = <&clk HC16XX_CLK_USB0>;
        resets = <&reset HC16XX_USB0_RESET>;
        phys = <&usb0phy>;

        dr_mode = "peripheral";
    };
