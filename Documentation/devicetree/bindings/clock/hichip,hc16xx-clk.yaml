%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/hichip,hc16xx-clk.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiChip HC16xx Clock Controller

maintainers:
  - Siarhei Volkau <lis8215@gmail.com>

description: |
  The HC16xx clock controller provides known
  clocks for peripherals integrated into HiChip HC16xx SoCs.
  Future revisions will extend supported clocks and add new
  ones.
  The clock controller provides:

    - external oscillator input
    - fixed-factor clocks
    - peripheral gate clocks
    - CPU clock selection

properties:
  compatible:
    enum:
      - hichip,hc16xx-clk

  reg:
    maxItems: 1

  "#clock-cells":
    const: 1

  clocks:
    maxItems: 1
    description:
      External crystal oscillator, typically 24MHz.

  clock-names:
    items:
      - const: hosc

required:
  - compatible
  - reg
  - "#clock-cells"
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/hichip,hc16xx-clock.h>

    hosc: oscillator {
        compatible = "fixed-clock";
        #clock-cells = <0>;
        clock-frequency = <24000000>;
    };

    clock-controller@b8800000 {
        compatible = "hichip,hc16xx-clk";
        reg = <0xb8800060 0x20>;

        clocks = <&hosc>;
        clock-names = "hosc";

        #clock-cells = <1>;
    };
