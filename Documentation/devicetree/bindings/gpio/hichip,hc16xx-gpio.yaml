%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/hichip,hc16xx-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiChip HC16xx GPIO controller

maintainers:
  - Siarhei Volkau <lis8215@gmail.com>

description: |
  GPIO controller found in HiChip HC16xx SoCs.

  The controller provides four GPIO banks of 32 GPIOs each:
    - left   GPIOs 0..31
    - bottom GPIOs 32..63
    - right  GPIOs 64..95
    - top    GPIOs 96..127

  Each bank has its own register block. GPIO interrupts from all four
  banks are combined into a single interrupt line.

properties:
  compatible:
    const: hichip,hc16xx-gpio

  reg:
    items:
      - description: Left GPIO bank
      - description: Bottom GPIO bank
      - description: Right GPIO bank
      - description: Top GPIO bank

  reg-names:
    items:
      - const: left
      - const: bottom
      - const: right
      - const: top

  interrupts:
    maxItems: 1

  interrupt-controller: true

  "#interrupt-cells":
    const: 2

  gpio-controller: true

  "#gpio-cells":
    const: 2

  gpio-ranges:
    maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-controller
  - "#interrupt-cells"
  - gpio-controller
  - "#gpio-cells"
  - gpio-ranges

additionalProperties: false

examples:
  - |
    gpio: gpio-controller@18800044 {
        compatible = "hichip,hc16xx-gpio";

        reg = <0x18800044 0x1c>,
              <0x188000c4 0x1c>,
              <0x188000e4 0x1c>,
              <0x18800344 0x1c>;
        reg-names = "left", "bottom", "right", "top";

        gpio-controller;
        #gpio-cells = <2>;

        gpio-ranges = <&pinctrl 0 0 128>;

        interrupt-parent = <&intc>;
        interrupts = <0>;

        interrupt-controller;
        #interrupt-cells = <2>;
    };
